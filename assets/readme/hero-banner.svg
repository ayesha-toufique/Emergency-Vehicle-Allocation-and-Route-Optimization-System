<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; r: 16px; }
      50% { opacity: 0.9; r: 24px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes floatSignal {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .flow-path {
      stroke-dasharray: 12 12;
      animation: dash 4s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 8;
      animation: dash 2.5s linear infinite;
    }
    .pulse-ring {
      animation: pulse 2.4s ease-in-out infinite;
    }
    .beacon {
      animation: blink 1.6s ease-in-out infinite;
    }
    .floating-card {
      animation: floatSignal 4s ease-in-out infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .text-mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glowPulse)" />
  <circle cx="950" cy="160" r="180" fill="#10b981" opacity="0.07" filter="url(#glowPulse)" />
  <circle cx="600" cy="60" r="100" fill="#3b82f6" opacity="0.06" filter="url(#glowPulse)" />

  <!-- Right Graphic: Karachi Simulated Network Map -->
  <g transform="translate(680, 40)">
    <!-- Road graph edges -->
    <path d="M 60 210 L 160 160 L 280 180 L 390 120 L 460 160 L 410 240 L 270 260 L 160 250 Z" 
          fill="rgba(6, 182, 212, 0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <path d="M 160 160 L 210 70 L 330 60 L 390 120" 
          fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <path d="M 210 70 L 280 180 L 270 260" 
          fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- Animated Dijkstra Shortest Path -->
    <path d="M 60 210 L 160 160 L 210 70 L 330 60 L 390 120" 
          fill="none" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round"
          class="flow-fast" filter="url(#glowCyan)" />

    <!-- Alternative Re-routed Path -->
    <path d="M 160 160 L 280 180 L 390 120" 
          fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round"
          class="flow-path" opacity="0.8" />

    <!-- Road Block Incident Beacon -->
    <circle cx="280" cy="180" r="18" fill="#ef4444" class="pulse-ring" />
    <circle cx="280" cy="180" r="6" fill="#ef4444" />
    <text x="280" y="206" fill="#f87171" font-size="10" font-weight="600" text-anchor="middle" class="text-mono">BLOCKED (0.7ms REROUTE)</text>

    <!-- Graph Nodes -->
    <circle cx="60" cy="210" r="6" fill="#38bdf8" />
    <circle cx="160" cy="160" r="5" fill="#94a3b8" />
    <circle cx="210" cy="70" r="5" fill="#10b981" />
    <circle cx="330" cy="60" r="5" fill="#10b981" />
    <circle cx="460" cy="160" r="5" fill="#94a3b8" />
    <circle cx="410" cy="240" r="5" fill="#94a3b8" />
    <circle cx="270" cy="260" r="5" fill="#94a3b8" />

    <!-- Target Emergency Destination Beacon -->
    <circle cx="390" cy="120" r="22" fill="#10b981" class="pulse-ring" />
    <circle cx="390" cy="120" r="8" fill="#10b981" filter="url(#glowCyan)" />
    <text x="390" y="98" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" class="text-mono">EMERGENCY SCENE</text>

    <!-- Origin Dispatch Unit Beacon -->
    <circle cx="60" cy="210" r="18" fill="#06b6d4" class="pulse-ring" />
    <circle cx="60" cy="210" r="7" fill="#06b6d4" />
    <text x="60" y="235" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle" class="text-mono">AMBULANCE (VH-01)</text>

    <!-- Live Floating Metric Badge -->
    <g class="floating-card" transform="translate(180, 220)">
      <rect width="180" height="52" rx="8" fill="#0f172a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="20" cy="26" r="5" fill="#10b981" class="beacon" />
      <text x="34" y="22" fill="#94a3b8" font-size="9" font-weight="600" class="text-mono">OPTIMAL ROUTE</text>
      <text x="34" y="38" fill="#f8fafc" font-size="13" font-weight="700" class="text-mono">4.2 km • 6.8 min</text>
    </g>
  </g>

  <!-- Left Content: Branding & Mission -->
  <g transform="translate(60, 60)">
    <!-- Pill Badge -->
    <rect width="260" height="28" rx="14" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#06b6d4" class="beacon" />
    <text x="28" y="18" fill="#38bdf8" font-size="11" font-weight="700" class="text-mono">MISSION-CRITICAL RESQ OPS</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-size="44" class="text-title">
      ResQ Operations
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" fill="url(#neonCyan)" font-size="20" font-weight="600" class="text-title">
      Emergency Vehicle Allocation &amp; Dijkstra Route Optimization
    </text>

    <!-- Description -->
    <text x="0" y="142" fill="#94a3b8" font-size="14" font-weight="400" class="text-title">
      Autonomous multi-criteria dispatch, dynamic Karachi road graph routing,
    </text>
    <text x="0" y="164" fill="#94a3b8" font-size="14" font-weight="400" class="text-title">
      multi-dimensional 0/1 Knapsack resource triage, and offline-resilient sync.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <rect width="130" height="28" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="65" y="18" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" class="text-mono">⚡ 0.7ms Dijkstra</text>

      <!-- Pill 2 -->
      <rect x="140" width="135" height="28" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="207" y="18" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" class="text-mono">🎒 0/1 Knapsack</text>

      <!-- Pill 3 -->
      <rect x="285" width="135" height="28" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="352" y="18" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" class="text-mono">📱 Flutter 3.x</text>

      <!-- Pill 4 -->
      <rect x="430" width="135" height="28" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="497" y="18" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" class="text-mono">🐍 Django REST</text>
    </g>
  </g>
</svg>
