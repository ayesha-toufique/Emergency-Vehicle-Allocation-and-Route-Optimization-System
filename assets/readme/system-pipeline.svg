<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="auto">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <style>
    @keyframes march {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes nodeGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #38bdf8); }
      50% { filter: drop-shadow(0 0 8px #34d399); }
    }
    .pipe-line {
      stroke-dasharray: 8 6;
      animation: march 1.8s linear infinite;
    }
    .step-box {
      transition: all 0.3s ease;
    }
    .txt-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
    }
    .txt-sub {
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 11px;
    }
  </style>

  <rect width="1100" height="240" fill="url(#pipeBg)" rx="12" />

  <!-- Connecting Pipeline Arrow -->
  <path d="M 230 120 L 310 120 M 510 120 L 590 120 M 790 120 L 870 120" 
        stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" class="pipe-line" />

  <!-- Step 1: Emergency Ingestion -->
  <g transform="translate(30, 40)" class="step-box">
    <rect width="200" height="150" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="100" cy="40" r="20" fill="#ef4444" opacity="0.15" />
    <text x="100" y="46" font-size="20" text-anchor="middle">🚨</text>
    <text x="100" y="82" fill="#ffffff" font-size="14" text-anchor="middle" class="txt-title">1. Incident Ingestion</text>
    <text x="100" y="104" fill="#94a3b8" text-anchor="middle" class="txt-sub">GPS Lat/Lng Validation</text>
    <text x="100" y="122" fill="#ef4444" text-anchor="middle" class="txt-sub">Priority: P = S×U×√N</text>
    <text x="100" y="140" fill="#64748b" text-anchor="middle" class="txt-sub">Severity 1-5 • Urgency 1-5</text>
  </g>

  <!-- Step 2: 0/1 Knapsack Resource Allocation -->
  <g transform="translate(310, 40)" class="step-box">
    <rect width="200" height="150" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="100" cy="40" r="20" fill="#f59e0b" opacity="0.15" />
    <text x="100" y="46" font-size="20" text-anchor="middle">🎒</text>
    <text x="100" y="82" fill="#ffffff" font-size="14" text-anchor="middle" class="txt-title">2. Knapsack 0/1 DP</text>
    <text x="100" y="104" fill="#94a3b8" text-anchor="middle" class="txt-sub">Constraint Optimization</text>
    <text x="100" y="122" fill="#f59e0b" text-anchor="middle" class="txt-sub">Crew • Fuel &gt; 15%</text>
    <text x="100" y="140" fill="#34d399" font-weight="600" text-anchor="middle" class="txt-sub">Runtime: 0.134 ms</text>
  </g>

  <!-- Step 3: Dijkstra Route Optimization -->
  <g transform="translate(590, 40)" class="step-box">
    <rect width="200" height="150" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="100" cy="40" r="20" fill="#06b6d4" opacity="0.15" />
    <text x="100" y="46" font-size="20" text-anchor="middle">⚡</text>
    <text x="100" y="82" fill="#ffffff" font-size="14" text-anchor="middle" class="txt-title">3. Dynamic Dijkstra</text>
    <text x="100" y="104" fill="#94a3b8" text-anchor="middle" class="txt-sub">900 Nodes • 1,718 Edges</text>
    <text x="100" y="122" fill="#38bdf8" text-anchor="middle" class="txt-sub">Real-Time Road Blocking</text>
    <text x="100" y="140" fill="#34d399" font-weight="600" text-anchor="middle" class="txt-sub">Runtime: 0.701 ms</text>
  </g>

  <!-- Step 4: Dispatch & Client Telemetry -->
  <g transform="translate(870, 40)" class="step-box">
    <rect width="200" height="150" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="100" cy="40" r="20" fill="#10b981" opacity="0.15" />
    <text x="100" y="46" font-size="20" text-anchor="middle">📡</text>
    <text x="100" y="82" fill="#ffffff" font-size="14" text-anchor="middle" class="txt-title">4. Real-Time Dispatch</text>
    <text x="100" y="104" fill="#94a3b8" text-anchor="middle" class="txt-sub">Driver Missions &amp; GPS</text>
    <text x="100" y="122" fill="#10b981" text-anchor="middle" class="txt-sub">Offline Mock Fallback</text>
    <text x="100" y="140" fill="#64748b" text-anchor="middle" class="txt-sub">Token Auth • Audit Trail</text>
  </g>
</svg>
